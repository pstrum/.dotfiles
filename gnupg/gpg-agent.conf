# Passphrase caching for GPG commit signing.
# TTL refreshes on each use; max-cache-ttl is a hard cap regardless of activity.
default-cache-ttl 600
max-cache-ttl 7200

# Use GPG Suite's pinentry-mac (Brewfile: cask "gpg-suite") so the prompt is the
# macOS dialog, which offers "Save in Keychain". Tick that once per machine and
# commit signing stops prompting. Without this, gpg falls back to a tty prompt
# that has no Keychain option, so you re-enter the passphrase every cache expiry.
pinentry-program /usr/local/MacGPG2/libexec/pinentry-mac.app/Contents/MacOS/pinentry-mac
